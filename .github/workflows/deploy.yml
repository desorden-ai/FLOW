name: Deploy FLOW
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/status.json <<JSON
          {"state":"pending","context":"cloudflare/deploy","description":"Deploying new FLOW base","target_url":"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"}
          JSON
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json
      - name: Check out repository with Git
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - name: Select Node.js 22 from runner toolcache
        run: |
          architecture="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          node_version_dir="$(find "$RUNNER_TOOL_CACHE/node" -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -n 1)"
          node_bin="${node_version_dir}/${architecture}/bin"
          test -x "$node_bin/node" || (echo "Node.js 22 is not available in RUNNER_TOOL_CACHE" && exit 1)
          echo "$node_bin" >> "$GITHUB_PATH"
          "$node_bin/node" --version
          "$node_bin/npm" --version
      - name: Deploy static FLOW to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy
      - name: Configure Panasonic custom domain DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones?name=desorden.cat&account.id=$CLOUDFLARE_ACCOUNT_ID" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/zones.json
          ZONE_ID="$(jq -r '.result[0].id // empty' /tmp/zones.json)"
          test -n "$ZONE_ID"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=panasonic.desorden.cat" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/records.json
          RECORD_ID="$(jq -r '.result[0].id // empty' /tmp/records.json)"
          BODY='{"type":"CNAME","name":"panasonic","content":"proxy-v2.appdeploy.ai","ttl":1,"proxied":false}'
          if [ -n "$RECORD_ID" ]; then
            curl --fail-with-body --silent --show-error \
              --request PUT \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$BODY" > /tmp/dns-result.json
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$BODY" > /tmp/dns-result.json
          fi
          jq -e '.success == true' /tmp/dns-result.json >/dev/null
          jq '{name:.result.name,type:.result.type,content:.result.content,proxied:.result.proxied}' /tmp/dns-result.json
      - name: Publish deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            state=success
            description="FLOW deployed successfully"
          else
            state=failure
            description="FLOW deployment failed"
          fi
          printf '{"state":"%s","context":"cloudflare/deploy","description":"%s","target_url":"%s/%s/actions/runs/%s"}' "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/status.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json
