name: Deploy FLOW
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/status.json <<JSON
          {"state":"pending","context":"cloudflare/deploy","description":"Deploying new FLOW base","target_url":"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"}
          JSON
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json
      - name: Check out repository with Git
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - name: Select Node.js 22 from runner toolcache
        run: |
          architecture="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          node_version_dir="$(find "$RUNNER_TOOL_CACHE/node" -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -n 1)"
          node_bin="${node_version_dir}/${architecture}/bin"
          test -x "$node_bin/node" || (echo "Node.js 22 is not available in RUNNER_TOOL_CACHE" && exit 1)
          echo "$node_bin" >> "$GITHUB_PATH"
          "$node_bin/node" --version
          "$node_bin/npm" --version
      - name: Deploy static FLOW to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy
      - name: Verify Panasonic custom domain
        id: domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            echo "DNS attempt $attempt"
            getent ahostsv4 panasonic.desorden.cat || true
            CODE="$(curl --silent --show-error --output /tmp/panasonic.html --write-out '%{http_code}' --max-time 15 https://panasonic.desorden.cat/ || true)"
            echo "HTTP=$CODE"
            if [ "$CODE" = '200' ] || [ "$CODE" = '302' ]; then
              echo "http=$CODE" >> "$GITHUB_OUTPUT"
              if [ "$CODE" = '302' ]; then
                curl -sSI --max-time 15 https://panasonic.desorden.cat/ | sed -n '1,15p' || true
              else
                head -c 300 /tmp/panasonic.html || true
              fi
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Publish Panasonic domain result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN_OUTCOME: ${{ steps.domain.outcome }}
          DOMAIN_HTTP: ${{ steps.domain.outputs.http }}
        run: |
          if [ "$DOMAIN_OUTCOME" = success ]; then state=success; description="panasonic.desorden.cat HTTP $DOMAIN_HTTP"; else state=failure; description='panasonic.desorden.cat not reachable'; fi
          jq -nc --arg state "$state" --arg description "$description" '{state:$state,context:"panasonic/domain",description:$description,target_url:"https://panasonic.desorden.cat"}' > /tmp/panasonic-domain.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/panasonic-domain.json >/dev/null
      - name: Publish deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then state=success; description="FLOW deployed successfully"; else state=failure; description="FLOW deployment failed"; fi
          printf '{"state":"%s","context":"cloudflare/deploy","description":"%s","target_url":"%s/%s/actions/runs/%s"}' "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/status.json
          curl --fail-with-body --silent --show-error \
            --request POST --header "Authorization: Bearer ${GH_TOKEN}" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json
