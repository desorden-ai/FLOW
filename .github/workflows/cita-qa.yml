name: CITA QA

on:
  push:
    branches:
      - Cita
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$BRANCH" "https://github.com/$GITHUB_REPOSITORY.git" repo
      - name: Run tests
        working-directory: repo
        run: |
          node --version
          npm --version
          npm test
