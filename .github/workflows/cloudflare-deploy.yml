name: Deploy to Cloudflare Workers
run-name: Deploy FLOW to Cloudflare · ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/deployment-status.json <<JSON
          {
            "state": "pending",
            "context": "cloudflare/deploy",
            "description": "Validating and deploying FLOW to Cloudflare",
            "target_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/deployment-status.json

      - name: Check out repository with Git
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Select Node.js 22 from runner toolcache
        run: |
          architecture="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          node_version_dir="$(find "$RUNNER_TOOL_CACHE/node" -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -n 1)"
          node_bin="${node_version_dir}/${architecture}/bin"
          test -x "$node_bin/node" || (echo "Node.js 22 is not available in RUNNER_TOOL_CACHE" && exit 1)
          echo "$node_bin" >> "$GITHUB_PATH"
          "$node_bin/node" --version
          "$node_bin/npm" --version

      - name: Refresh patched Nano ID lock entry
        run: npm update nanoid --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment configuration
        id: configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDITOR_PASSWORD: ${{ secrets.EDITOR_PASSWORD }}
          EDITOR_SESSION_SECRET: ${{ secrets.EDITOR_SESSION_SECRET }}
          EDITOR_KV_ID: ${{ vars.EDITOR_KV_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$EDITOR_PASSWORD" || (echo "Missing EDITOR_PASSWORD" && exit 1)
          test "${#EDITOR_PASSWORD}" -ge 12 || (echo "EDITOR_PASSWORD must contain at least 12 characters" && exit 1)
          test -n "$EDITOR_SESSION_SECRET" || (echo "Missing EDITOR_SESSION_SECRET" && exit 1)
          test "${#EDITOR_SESSION_SECRET}" -ge 32 || (echo "EDITOR_SESSION_SECRET must contain at least 32 characters" && exit 1)
          test -n "$EDITOR_KV_ID" || (echo "Missing EDITOR_KV_ID repository variable" && exit 1)
          [[ "$EDITOR_KV_ID" =~ ^[0-9a-fA-F]{32}$ ]] || (echo "EDITOR_KV_ID must be a 32-character Cloudflare KV namespace ID" && exit 1)

      - name: Configure production KV binding
        id: binding
        env:
          EDITOR_KV_ID: ${{ vars.EDITOR_KV_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "wrangler.jsonc";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.kv_namespaces ??= [];

          const existingBinding = config.kv_namespaces.find(
            (entry) => entry.binding === "EDITOR_KV",
          );

          if (existingBinding) {
            existingBinding.id = process.env.EDITOR_KV_ID;
          } else {
            config.kv_namespaces.push({
              binding: "EDITOR_KV",
              id: process.env.EDITOR_KV_ID,
            });
          }

          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Audit production dependencies
        id: audit
        run: npm run audit:prod

      - name: Lint
        id: lint
        run: npm run lint

      - name: Test
        id: test
        run: npm test

      - name: Build
        id: build
        run: npm run build

      - name: Verify deployment package
        id: dry_run
        run: npm run deploy:dry

      - name: Prepare encrypted editor secrets
        id: editor_secrets
        env:
          EDITOR_PASSWORD: ${{ secrets.EDITOR_PASSWORD }}
          EDITOR_SESSION_SECRET: ${{ secrets.EDITOR_SESSION_SECRET }}
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const outputPath = path.join(process.env.RUNNER_TEMP, "editor-secrets.json");
          fs.writeFileSync(
            outputPath,
            JSON.stringify({
              EDITOR_PASSWORD: process.env.EDITOR_PASSWORD,
              EDITOR_SESSION_SECRET: process.env.EDITOR_SESSION_SECRET,
            }),
            { mode: 0o600 },
          );
          NODE

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --secrets-file "${RUNNER_TEMP}/editor-secrets.json" --keep-vars

      - name: Remove temporary editor secrets
        if: always()
        run: rm -f "${RUNNER_TEMP}/editor-secrets.json"

      - name: Publish deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURATION_OUTCOME: ${{ steps.configuration.outcome }}
          BINDING_OUTCOME: ${{ steps.binding.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
          EDITOR_SECRETS_OUTCOME: ${{ steps.editor_secrets.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          node --input-type=module <<'NODE' > /tmp/deployment-status.json
          const outcomes = [
            ["configuration", process.env.CONFIGURATION_OUTCOME],
            ["KV binding", process.env.BINDING_OUTCOME],
            ["dependency audit", process.env.AUDIT_OUTCOME],
            ["lint", process.env.LINT_OUTCOME],
            ["tests", process.env.TEST_OUTCOME],
            ["build", process.env.BUILD_OUTCOME],
            ["dry run", process.env.DRY_RUN_OUTCOME],
            ["editor secrets", process.env.EDITOR_SECRETS_OUTCOME],
            ["deployment", process.env.DEPLOY_OUTCOME],
          ];
          const success = process.env.DEPLOY_OUTCOME === "success";
          const failedStep = outcomes.find(
            ([, outcome]) => outcome && outcome !== "success" && outcome !== "skipped",
          );
          const payload = {
            state: success ? "success" : "failure",
            context: "cloudflare/deploy",
            description: success
              ? "FLOW validated and deployed successfully"
              : `FLOW deployment failed${failedStep ? ` during ${failedStep[0]}` : ""}`,
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/deployment-status.json
