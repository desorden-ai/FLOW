name: Deploy FLOW Lab
run-name: Deploy FLOW Lab · ${{ github.sha }}

on:
  push:
    branches: [lab/visual-3d]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-flow-lab
  cancel-in-progress: true

jobs:
  deploy-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Mark laboratory deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/deployment-status.json <<JSON
          {
            "state": "pending",
            "context": "cloudflare/lab",
            "description": "Validating and deploying the isolated FLOW Lab",
            "target_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/deployment-status.json

      - name: Check out laboratory branch
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Select Node.js 22 from runner toolcache
        run: |
          architecture="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          node_version_dir="$(find "$RUNNER_TOOL_CACHE/node" -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -n 1)"
          node_bin="${node_version_dir}/${architecture}/bin"
          test -x "$node_bin/node" || (echo "Node.js 22 is not available" && exit 1)
          echo "$node_bin" >> "$GITHUB_PATH"
          "$node_bin/node" --version
          "$node_bin/npm" --version

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        id: configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Audit production dependencies
        id: audit
        run: npm run audit:prod

      - name: Lint
        id: lint
        run: npm run lint

      - name: Test
        id: test
        run: npm test

      - name: Build
        id: build
        run: npm run build

      - name: Verify deployment package
        id: dry_run
        run: npm run deploy:dry

      - name: Deploy isolated laboratory Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --name flow-lab

      - name: Publish laboratory deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURATION_OUTCOME: ${{ steps.configuration.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          node --input-type=module <<'NODE' > /tmp/deployment-status.json
          const outcomes = [
            ["configuration", process.env.CONFIGURATION_OUTCOME],
            ["dependency audit", process.env.AUDIT_OUTCOME],
            ["lint", process.env.LINT_OUTCOME],
            ["tests", process.env.TEST_OUTCOME],
            ["build", process.env.BUILD_OUTCOME],
            ["dry run", process.env.DRY_RUN_OUTCOME],
            ["deployment", process.env.DEPLOY_OUTCOME],
          ];
          const success = process.env.DEPLOY_OUTCOME === "success";
          const failedStep = outcomes.find(
            ([, outcome]) => outcome && outcome !== "success" && outcome !== "skipped",
          );
          process.stdout.write(JSON.stringify({
            state: success ? "success" : "failure",
            context: "cloudflare/lab",
            description: success
              ? "FLOW Lab validated and deployed successfully"
              : `FLOW Lab deployment failed${failedStep ? ` during ${failedStep[0]}` : ""}`,
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/deployment-status.json
