name: Panasonic SAT Deploy Command

on:
  issues:
    types: [opened]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: github.event_name == 'schedule' || (github.event.issue.user.login == 'desorden-ai' && github.event.issue.title == 'DEPLOY PANASONIC SAT CLOUDFLARE')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_NAME: panasonic-sat-servicepro
      ACCESS_APP_NAME: Panasonic SAT ServicePro
      ALLOWED_EMAIL: desorden.help@gmail.com
      DEPLOY_ISSUE: '57'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Mark run started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$DEPLOY_ISSUE" --repo "$GITHUB_REPOSITORY" --body "PANASONIC_DEPLOY_STARTED\nRUN=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Checkout Panasonic branch
        uses: actions/checkout@v4
        with:
          ref: PANASONIC-SAT-CF

      - name: Validate Cloudflare authorization
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail-with-body --silent --show-error "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/workers.json
          jq -e '.success == true' /tmp/workers.json >/dev/null

      - name: Deploy Panasonic Worker
        id: deploy
        working-directory: panasonic-sat
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy 2>&1 | tee /tmp/panasonic-deploy.txt
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/panasonic-deploy.txt | tail -1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify health before protection
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$APP_URL/api/health" | tee /tmp/health.json
          jq -e '.ok == true and .service == "panasonic-sat-servicepro"' /tmp/health.json >/dev/null

      - name: Configure Cloudflare Access
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/workers.json
          WORKER_ID="$(jq -r --arg name "$WORKER_NAME" '.result[] | select(.id == $name) | .tag' /tmp/workers.json | head -1)"
          test -n "$WORKER_ID" && test "$WORKER_ID" != "null"
          curl --fail-with-body --silent --show-error "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=100" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/access-apps.json
          OLD_IDS="$(jq -r --arg name "$ACCESS_APP_NAME" '.result[]? | select(.name == $name) | .id' /tmp/access-apps.json)"
          for id in $OLD_IDS; do curl --fail-with-body --silent --show-error -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null; done
          jq -n --arg name "$ACCESS_APP_NAME" --arg worker "$WORKER_ID" --arg email "$ALLOWED_EMAIL" '{type:"self_hosted",name:$name,destinations:[{type:"worker",worker_id:$worker}],session_duration:"24h",policies:[{name:"Panasonic SAT owner only",decision:"allow",include:[{email:{email:$email}}]}]}' >/tmp/access-payload.json
          curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/access-payload.json >/tmp/access-result.json
          jq -e '.success == true' /tmp/access-result.json >/dev/null
          secured=0
          for attempt in 1 2 3 4 5 6; do code="$(curl -sS -o /dev/null -w '%{http_code}' "$APP_URL/")"; echo "Access check $attempt: HTTP $code"; if [ "$code" != "200" ]; then secured=1; break; fi; sleep 5; done
          test "$secured" = "1"

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh issue comment "$DEPLOY_ISSUE" --repo "$GITHUB_REPOSITORY" --body "PANASONIC_DEPLOY_SUCCESS\nURL=$APP_URL\nAUTH=Cloudflare Access OTP / $ALLOWED_EMAIL\nDB=Durable Objects SQLite\nAI=Workers AI Gemma 4 Vision\nRUN=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$DEPLOY_ISSUE" --repo "$GITHUB_REPOSITORY" --body "PANASONIC_DEPLOY_FAILURE\nRUN=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
