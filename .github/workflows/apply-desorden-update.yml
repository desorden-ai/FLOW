name: Apply DESORDEN visual update
run-name: Apply DESORDEN visual update and deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-desorden-update.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply accumulated DESORDEN changes
        env:
          APPLY_SCRIPT_B64: "...