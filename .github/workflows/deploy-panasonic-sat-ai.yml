name: Deploy Panasonic SAT Cloud AI

on:
  push:
    branches: [PANASONIC-SAT-CF]
    paths:
      - 'panasonic-sat-ai/**'
      - '.github/workflows/deploy-panasonic-sat-ai.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify deployment secrets without exposing values
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GEMINI_API_KEY"

      - name: Install and validate
        working-directory: panasonic-sat-ai
        run: |
          npm install --ignore-scripts
          npm test
          npx wrangler deploy --dry-run

      - name: Deploy dedicated mobile API
        id: deploy
        working-directory: panasonic-sat-ai
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          npx wrangler deploy 2>&1 | tee /tmp/panasonic-ai-deploy.txt
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/panasonic-ai-deploy.txt | tail -1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify health and synthetic extraction
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$APP_URL/api/health" | jq -e '.ok == true and .configured == true'
          curl --fail-with-body --silent --show-error \
            -H 'Origin: https://localhost' \
            -H 'Content-Type: application/json' \
            -H 'X-SAT-Client-Id: github-actions-synthetic' \
            --data '{"text":"Work Order: WO-SYNTH-001\nService Appointment: SA-SYNTH-001\nCustomer: Cliente Sintético\nIndoor model: CS-Z25\nOutdoor model: CU-Z25\nError code: H11"}' \
            "$APP_URL/api/extract-servicepro" >/tmp/extraction.json
          jq -e '.extracted.servicePro.workOrder | length > 0' /tmp/extraction.json

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = success ]; then state=success; description='Panasonic SAT Gemini API deployed'; else state=failure; description='Panasonic SAT Gemini API deployment failed'; fi
          target="${APP_URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}"
          jq -n --arg state "$state" --arg description "$description" --arg target_url "$target" \
            '{state:$state,context:"panasonic/cloud-ai",description:$description,target_url:$target_url}' >/tmp/status.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data-binary @/tmp/status.json >/dev/null
