name: Browser quality audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository with Git
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js 22 with nvm
        run: |
          export NVM_DIR="$HOME/.nvm"
          test -s "$NVM_DIR/nvm.sh" || (echo "nvm is not available on this runner" && exit 1)
          . "$NVM_DIR/nvm.sh"
          nvm install 22
          nvm use 22
          echo "$NVM_BIN" >> "$GITHUB_PATH"
          node --version
          npm --version

      - name: Install project dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run audit:prod
          npm run lint
          npm test
          npm run build
          npm run deploy:dry

      - name: Install pinned browser audit tools
        run: |
          npm install --no-save --package-lock=false \
            @playwright/test@1.54.2 \
            @axe-core/playwright@4.10.2 \
            lighthouse@12.8.2
          npx playwright install --with-deps chromium

      - name: Start production Worker preview
        run: |
          npx --no-install wrangler dev --local --ip 127.0.0.1 --port 3000 > /tmp/flow-preview.log 2>&1 &
          echo $! > /tmp/flow-preview.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/flow-preview.log
          exit 1

      - name: Run Android and accessibility tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test

      - name: Run mobile Lighthouse audit
        run: |
          npx lighthouse http://127.0.0.1:3000/ \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=html \
            --output=json \
            --output-path=./lighthouse-report

      - name: Enforce mobile Lighthouse budgets
        run: node scripts/assert-lighthouse.mjs

      - name: Stop Worker preview
        if: always()
        run: |
          if [ -f /tmp/flow-preview.pid ]; then
            kill "$(cat /tmp/flow-preview.pid)" 2>/dev/null || true
          fi

      - name: Summarize browser audit outputs
        if: always()
        run: |
          {
            echo "## Browser quality audit"
            echo
            echo "Generated files:"
            find playwright-report test-results . -maxdepth 1 \
              \( -name 'lighthouse-report*' -o -path 'playwright-report/*' -o -path 'test-results/*' \) \
              -type f -print 2>/dev/null | sort | sed 's/^/- `/' | sed 's/$/`/' || true
            echo
            echo "### Worker preview log"
            echo '```text'
            tail -n 200 /tmp/flow-preview.log 2>/dev/null || echo "No preview log was generated."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
