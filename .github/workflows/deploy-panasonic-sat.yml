name: Deploy Panasonic SAT Cloudflare

on:
  push:
    branches: [PANASONIC-SAT-CF]
    paths:
      - 'panasonic-sat/**'
      - '.github/workflows/deploy-panasonic-sat.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_NAME: panasonic-sat-servicepro
      ACCESS_APP_NAME: Panasonic SAT ServicePro
      ALLOWED_EMAIL: desorden.help@gmail.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '{"state":"pending","context":"panasonic/cloudflare","description":"Deploying Panasonic SAT","target_url":"%s/%s/actions/runs/%s"}' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >/tmp/status.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json >/dev/null

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare authorization
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/workers.json
          jq -e '.success == true' /tmp/workers.json >/dev/null

      - name: Deploy Worker, Durable Object and Workers AI
        id: deploy
        working-directory: panasonic-sat
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy 2>&1 | tee /tmp/panasonic-deploy.txt
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/panasonic-deploy.txt | tail -1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $URL"

      - name: Upsert Cloudflare Access protection
        id: protect
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/workers.json
          WORKER_ID="$(jq -r --arg name "$WORKER_NAME" '.result[] | select(.id == $name) | .tag' /tmp/workers.json | head -1)"
          test -n "$WORKER_ID" && test "$WORKER_ID" != "null"

          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/access-apps.json
          ACCESS_ID="$(jq -r --arg name "$ACCESS_APP_NAME" '.result[]? | select(.name == $name) | .id' /tmp/access-apps.json | head -1)"

          jq -n --arg name "$ACCESS_APP_NAME" --arg worker "$WORKER_ID" --arg email "$ALLOWED_EMAIL" \
            '{type:"self_hosted",name:$name,destinations:[{type:"worker",worker_id:$worker}],session_duration:"24h",policies:[{name:"Panasonic SAT owner only",decision:"allow",include:[{email:{email:$email}}]}]}' \
            >/tmp/access-payload.json

          if [ -n "$ACCESS_ID" ] && [ "$ACCESS_ID" != "null" ]; then
            METHOD=PUT
            ENDPOINT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$ACCESS_ID"
          else
            METHOD=POST
            ENDPOINT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps"
          fi

          curl --fail-with-body --silent --show-error -X "$METHOD" "$ENDPOINT" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/access-payload.json >/tmp/access-result.json
          jq -e '.success == true' /tmp/access-result.json >/dev/null

          secured=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$APP_URL/")"
            echo "Access verification $attempt: HTTP $code"
            if [ "$code" != "200" ]; then secured=1; break; fi
            sleep 5
          done
          test "$secured" = "1"

      - name: Deployment summary
        if: success()
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Panasonic SAT ServicePro"
            echo "- URL: $APP_URL"
            echo "- Authorization: Cloudflare Access / allowed email"
            echo "- Database: Durable Objects"
            echo "- AI: Workers AI / Gemma 4 Vision"
            echo "- Firebase: not used"
            echo "- AppDeploy: not used"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ]; then
            state=success
            description="Panasonic SAT deployed and protected"
            target="$APP_URL"
          else
            state=failure
            description="Panasonic SAT deployment needs repair"
            target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          printf '{"state":"%s","context":"panasonic/cloudflare","description":"%s","target_url":"%s"}' "$state" "$description" "$target" >/tmp/status-final.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status-final.json >/dev/null
