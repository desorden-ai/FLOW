name: Cleanup DESORDEN deployment files
run-name: Remove temporary DESORDEN deployment files

on:
  push:
    branches: [main]
    paths:
      - .desorden-update-trigger

permissions:
  contents: write
  statuses: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove temporary deployment files
        run: |
          git config user.name "DESORDEN Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .desorden-update-trigger
          git rm -f .github/workflows/apply-desorden-update.yml
          git rm -f .github/workflows/trigger-desorden-update.yml
          git rm -f scripts/apply-desorden-update.py
          git rm -f .desorden-assets/chunk-00 .desorden-assets/chunk-01 \
            .desorden-assets/chunk-02 .desorden-assets/chunk-03 \
            .desorden-assets/chunk-04 .desorden-assets/chunk-05
          git commit -m "chore: remove temporary DESORDEN deployment files"
          git push origin HEAD:main

      - name: Mark cleanup successful
        uses: actions/github-script@v8
        with:
          script: |
            const { execSync } = require("node:child_process");
            const sha = execSync("git rev-parse HEAD").toString().trim();
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: "success",
              context: "repository/cleanup",
              description: "Temporary DESORDEN deployment files removed",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
