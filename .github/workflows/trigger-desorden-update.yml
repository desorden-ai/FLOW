name: Execute DESORDEN update
run-name: Apply accumulated DESORDEN changes and deploy

on:
  push:
    branches: [main]
    paths:
      - .desorden-update-trigger

permissions:
  contents: write
  statuses: write

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark update pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "desorden/apply",
              description: "Applying accumulated DESORDEN changes",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and apply prepared update
        id: apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import os
          import subprocess

          source = Path('.github/workflows/apply-desorden-update.yml').read_text(encoding='utf-8')
          names = ('APPLY_SCRIPT_B64', 'HERO_B64', 'ROSALIA_B64', 'ROZALEN_B64', 'LEIRE_B64')
          values = {}
          for name in names:
              prefix = f'{name}:'
              line = next((item.strip() for item in source.splitlines() if item.strip().startswith(prefix)), None)
              if line is None:
                  raise SystemExit(f'Missing encoded resource: {name}')
              value = line.split(':', 1)[1].strip().strip('"').strip("'")
              if not value:
                  raise SystemExit(f'Empty encoded resource: {name}')
              values[name] = value

          script = Path('/tmp/apply_desorden.py')
          script.write_bytes(base64.b64decode(values.pop('APPLY_SCRIPT_B64')))
          env = os.environ.copy()
          env.update(values)
          subprocess.run(['python3', str(script)], check=True, env=env)
          PY

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Test
        id: test
        run: npm test

      - name: Build
        id: build
        run: npm run build

      - name: Commit integrated changes
        id: commit
        run: |
          git config user.name "DESORDEN Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/globals.css tests/rendered-html.test.mjs public/media/hero/portada-chico-bn.webp public/media/social-proof/rosalia.webp public/media/social-proof/rozalen.webp public/media/social-proof/leire.webp
          git commit -m "feat: add DESORDEN hero visuals and artist social proof"
          git push origin HEAD:main

      - name: Verify Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy updated site to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.92.0"
          command: deploy

      - name: Publish update result
        if: always()
        uses: actions/github-script@v8
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const phases = [
              ["apply", process.env.APPLY_OUTCOME],
              ["install", process.env.INSTALL_OUTCOME],
              ["tests", process.env.TEST_OUTCOME],
              ["build", process.env.BUILD_OUTCOME],
              ["commit", process.env.COMMIT_OUTCOME],
              ["credentials", process.env.CREDENTIALS_OUTCOME],
              ["deployment", process.env.DEPLOY_OUTCOME],
            ];
            const failed = phases.find(([, outcome]) => outcome && outcome !== "success" && outcome !== "skipped");
            const success = process.env.DEPLOY_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "desorden/apply",
              description: success ? "DESORDEN changes applied and deployed" : `DESORDEN update failed${failed ? ` during ${failed[0]}` : ""}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
