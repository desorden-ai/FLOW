name: Execute DESORDEN update
run-name: Apply accumulated DESORDEN changes and deploy

on:
  push:
    branches: [main]
    paths:
      - .desorden-update-trigger

permissions:
  contents: write
  statuses: write

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and apply prepared update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import os
          import re
          import subprocess

          source = Path('.github/workflows/apply-desorden-update.yml').read_text(encoding='utf-8')
          names = ('APPLY_SCRIPT_B64', 'HERO_B64', 'ROSALIA_B64', 'ROZALEN_B64', 'LEIRE_B64')
          values = {}
          for name in names:
              match = re.search(rf'^\s+{name}: "([A-Za-z0-9+/=]+)"$', source, re.MULTILINE)
              if not match:
                  raise SystemExit(f'Missing encoded resource: {name}')
              values[name] = match.group(1)

          script = Path('/tmp/apply_desorden.py')
          script.write_bytes(base64.b64decode(values.pop('APPLY_SCRIPT_B64')))
          env = os.environ.copy()
          env.update(values)
          subprocess.run(['python3', str(script)], check=True, env=env)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit integrated changes
        run: |
          git config user.name "DESORDEN Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/globals.css tests/rendered-html.test.mjs public/media/hero/portada-chico-bn.webp public/media/social-proof/rosalia.webp public/media/social-proof/rozalen.webp public/media/social-proof/leire.webp
          git commit -m "feat: add DESORDEN hero visuals and artist social proof"
          git push origin HEAD:main

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy updated site to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.92.0"
          command: deploy

      - name: Publish deployment status
        if: always()
        uses: actions/github-script@v8
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const { execSync } = require("node:child_process");
            const sha = execSync("git rev-parse HEAD").toString().trim();
            const success = process.env.DEPLOY_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: success ? "success" : "failure",
              context: "cloudflare/deploy",
              description: success ? "DESORDEN update deployed to Cloudflare" : "DESORDEN deployment failed",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
