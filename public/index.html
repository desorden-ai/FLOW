<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>DESORDEN</title>
<style>
:root{--gold:#E39400;--fg:#f5f5f5;--muted:rgba(255,255,255,.48);--line:rgba(255,255,255,.18)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:var(--fg);overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{position:fixed;inset:0;height:100svh;min-height:100svh}.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000;opacity:1;transform:scale(1);transition:opacity .62s cubic-bezier(.2,.75,.2,1),transform .62s cubic-bezier(.2,.75,.2,1)}.gate.exit{opacity:0;transform:scale(.97);pointer-events:none}.stack{display:grid;justify-items:center;gap:26px;transform:translateY(-1.5vh)}.loader{position:relative;width:min(11.7vw,10.2vh,93px);aspect-ratio:1;display:grid;place-items:center;perspective:420px;transform-style:preserve-3d}.letter{position:absolute;inset:0;display:grid;place-items:center;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:min(10.5vw,9.3vh,84px);line-height:1;font-weight:900;color:#E9A326;background:linear-gradient(180deg,#ffd467 0%,#f1a626 54%,#b96800 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 1px 0 rgba(255,216,110,.18),0 8px 20px rgba(227,148,0,.08);transform-origin:50% 54%;will-change:transform,opacity;backface-visibility:hidden}.cookies{width:min(84vw,330px);border:1px solid var(--line);padding:15px 16px 14px;display:grid;gap:12px;background:#000}.cookie-title{font-size:9px;line-height:1;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.76)}.copy{margin:0;font-size:10px;line-height:1.55;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{appearance:none;border:1px solid var(--line);background:#000;color:#fff;min-height:38px;padding:0 12px;font:600 9px/1 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}.btn:active{transform:scale(.98)}.accept{border-color:rgba(227,148,0,.78);color:#f0aa31}.state{min-height:10px;font-size:8px;line-height:1.35;letter-spacing:.07em;color:rgba(255,255,255,.32)}.experience{position:fixed;inset:0;z-index:5;background:#000;opacity:0;transform:scale(1.015);pointer-events:none;transition:opacity .7s cubic-bezier(.2,.75,.2,1),transform .7s cubic-bezier(.2,.75,.2,1);perspective:1000px;overflow:hidden}.experience.show{opacity:1;transform:scale(1);pointer-events:auto}.portrait{contain:layout paint style;position:absolute;right:0;top:50%;width:min(94.6vw,46.2vh);aspect-ratio:9/16;transform-origin:100% 50%;transform-style:preserve-3d;will-change:transform;isolation:isolate;-webkit-mask-image:radial-gradient(ellipse at 62% 46%,#000 0%,#000 34%,rgba(0,0,0,.98) 48%,rgba(0,0,0,.82) 61%,rgba(0,0,0,.52) 73%,rgba(0,0,0,.22) 84%,transparent 96%);mask-image:radial-gradient(ellipse at 62% 46%,#000 0%,#000 34%,rgba(0,0,0,.98) 48%,rgba(0,0,0,.82) 61%,rgba(0,0,0,.52) 73%,rgba(0,0,0,.22) 84%,transparent 96%)}.face-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000;opacity:0;will-change:opacity;filter:contrast(1.08) brightness(.98) saturate(.96)}.shade{position:absolute;inset:-10%;pointer-events:none;background:radial-gradient(ellipse at 62% 46%,transparent 24%,rgba(0,0,0,.08) 45%,rgba(0,0,0,.28) 62%,rgba(0,0,0,.62) 78%,rgba(0,0,0,.96) 96%,#000 100%)}@media(max-width:520px){.stack{gap:23px}.cookies{width:min(86vw,315px)}}@media(prefers-reduced-motion:reduce){.gate,.experience{transition-duration:.15s}.portrait{transform:translateY(-50%)!important}}
</style>
</head>
<body>
<section class="gate" id="gate" aria-label="Carga y preferencias de cookies"><div class="stack"><div class="loader" aria-hidden="true"><div class="letter" id="currentLetter">D</div><div class="letter" id="nextLetter">E</div></div><aside class="cookies" aria-label="Preferencias de cookies"><div class="cookie-title">Cookies</div><p class="copy" id="copy"></p><div class="actions"><button class="btn" id="reject" type="button">Rechazar</button><button class="btn accept" id="accept" type="button">Aceptar</button></div><div class="state" id="state" aria-live="polite"></div></aside></div></section>
<section class="experience" id="experience" aria-hidden="true"><div class="portrait" id="portrait"><img class="face-frame" id="f0" alt=""><img class="face-frame" id="f1" alt=""><img class="face-frame" id="f2" alt=""><img class="face-frame" id="f3" alt=""><img class="face-frame" id="f4" alt=""><div class="shade"></div></div></section>
<script>
(()=>{const letters=['D','E','S','O','R','D','E','N'];const frameGroups=[['/frames/face-01.txt'],['/frames/face-02.txt'],['/frames/face-03a.txt','/frames/face-03b.txt','/frames/face-03c.txt'],['/frames/face-04a.txt','/frames/face-04b.txt','/frames/face-04c.txt'],['/frames/face-05a1.txt','/frames/face-05a2.txt','/frames/face-05b1.txt','/frames/face-05b2.txt','/frames/face-05c.txt']];const totalChars=69132;const gate=document.getElementById('gate'),experience=document.getElementById('experience'),portrait=document.getElementById('portrait'),currentLetter=document.getElementById('currentLetter'),nextLetter=document.getElementById('nextLetter'),accept=document.getElementById('accept'),reject=document.getElementById('reject'),copy=document.getElementById('copy'),state=document.getElementById('state'),imgs=[0,1,2,3,4].map(i=>document.getElementById('f'+i));let loadTarget=0,loadShown=0,lastTs=performance.now(),ready=false,entering=false;let faceTarget=0,faceSmooth=0,dragging=false,pointerId=null,startY=0,startProgress=0,holdTimer=0,moved=false,wheelLock=false;const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));function readConsent(){const m=document.cookie.match(/(?:^|;\s*)desorden_cookie_consent=([^;]+)/);return m?decodeURIComponent(m[1]):null}let consent=readConsent();function writeConsent(v){const p=[`desorden_cookie_consent=${encodeURIComponent(v)}`,'Max-Age=31536000','Path=/','SameSite=Lax'];if(location.protocol==='https:')p.push('Secure');document.cookie=p.join('; ')}function ui(){if(consent==='accepted'){copy.textContent='Preferencia aceptada. Entraremos cuando la carga llegue a la N.';state.textContent='PREFERENCIA GUARDADA: ACEPTADA'}else if(consent==='rejected'){copy.textContent='Has rechazado las cookies. La carga puede finalizar, pero el rostro seguirá bloqueado hasta que aceptes.';state.textContent='PREFERENCIA GUARDADA: RECHAZADA'}else{copy.textContent='Usamos una cookie de preferencia para recordar tu elección. Acepta para entrar en la experiencia interactiva.';state.textContent=''}}async function load(){try{let received=0;for(let i=0;i<frameGroups.length;i++){let b64='';for(const u of frameGroups[i]){const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw new Error(u);const part=await r.text();b64+=part;received+=part.length;loadTarget=Math.min(.995,received/totalChars)}imgs[i].src='data:image/webp;base64,'+b64}loadTarget=1;ready=true;maybeEnter()}catch(e){console.error(e);state.textContent='ERROR DE CARGA — RECARGA LA PÁGINA'}}function renderLoader(){const p=clamp(loadShown),z=p*(letters.length-1),i=Math.min(letters.length-2,Math.floor(z)),t=i>=letters.length-1?1:z-i;currentLetter.textContent=letters[i];nextLetter.textContent=letters[Math.min(i+1,letters.length-1)];currentLetter.style.opacity=String(1-t);nextLetter.style.opacity=String(t);currentLetter.style.transform=`rotateX(${-92*t}deg) translateZ(${6*Math.sin(t*Math.PI)}px)`;nextLetter.style.transform=`rotateX(${92*(1-t)}deg) translateZ(${6*Math.sin(t*Math.PI)}px)`}function renderFace(){const p=clamp(faceSmooth),z=p*(imgs.length-1),i=Math.min(imgs.length-2,Math.floor(z)),t=z-i;for(let n=0;n<imgs.length;n++)imgs[n].style.opacity='0';imgs[i].style.opacity=String(1-t);imgs[Math.min(i+1,imgs.length-1)].style.opacity=String(t);const c=p-.5;portrait.style.transform=`translate3d(${c*1.0}%,-50%,0) rotateY(${c*1.8}deg) rotateX(${-c*.55}deg) scale(${.778+Math.abs(c)*.012})`}function loop(ts){const dt=Math.min(.05,Math.max(.001,(ts-lastTs)/1000));lastTs=ts;loadShown+=(loadTarget-loadShown)*(1-Math.exp(-8*dt));if(loadTarget===1&&1-loadShown<.001)loadShown=1;if(!dragging)faceSmooth+=(faceTarget-faceSmooth)*.13;renderLoader();renderFace();requestAnimationFrame(loop)}function maybeEnter(){if(entering||!ready||consent!=='accepted')return;entering=true;experience.setAttribute('aria-hidden','false');experience.classList.add('show');requestAnimationFrame(()=>gate.classList.add('exit'));setTimeout(()=>gate.style.display='none',740)}accept.addEventListener('click',()=>{writeConsent('accepted');consent='accepted';ui();maybeEnter()});reject.addEventListener('click',()=>{writeConsent('rejected');consent='rejected';ui()});function step(dir){const p=faceTarget;faceTarget=dir>0?(p<.49?.5:1):(p>.51?.5:0)}experience.addEventListener('wheel',e=>{e.preventDefault();if(wheelLock||Math.abs(e.deltaY)<4)return;step(e.deltaY>0?1:-1);wheelLock=true;setTimeout(()=>wheelLock=false,360)},{passive:false});experience.addEventListener('pointerdown',e=>{pointerId=e.pointerId;startY=e.clientY;startProgress=faceTarget;moved=false;dragging=e.pointerType==='mouse';experience.setPointerCapture?.(pointerId);if(e.pointerType!=='mouse')holdTimer=setTimeout(()=>dragging=true,170)});experience.addEventListener('pointermove',e=>{if(e.pointerId!==pointerId)return;const dy=e.clientY-startY;if(Math.abs(dy)>8)moved=true;if(!dragging&&Math.abs(dy)>30){clearTimeout(holdTimer);dragging=true}if(dragging){e.preventDefault();faceTarget=clamp(startProgress-dy/(innerHeight*.78));faceSmooth=faceTarget}},{passive:false});function end(e){if(e.pointerId!==pointerId)return;clearTimeout(holdTimer);if(!dragging&&moved)step(e.clientY<startY?1:-1);dragging=false;pointerId=null}experience.addEventListener('pointerup',end);experience.addEventListener('pointercancel',end);ui();requestAnimationFrame(loop);load()})();
</script>
</body></html>
